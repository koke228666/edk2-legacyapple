name: C/C++ CI

on:
  push:
    branches: [ "refactor" ]
  pull_request:
    branches: [ "refactor" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: CI Build
      run: chmod +x ci-build.sh && ./ci-build.sh

    - uses: actions/upload-artifact@v3
      with:
        name: iPhone 5
        path: ./workspace/iphone5.bin
    - uses: actions/upload-artifact@v3
      with:
        name: iPad2
        path: ./workspace/ipad2.bin
